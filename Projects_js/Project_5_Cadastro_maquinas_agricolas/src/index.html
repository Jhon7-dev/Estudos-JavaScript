<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div class="bg-gray-200 w-full min-h-screen flex items-center justify-center">
            <div class="lg:flex items-center space-x-16">
                <div class="w-5/6 md:w-3/4 lg:w-2/3 xl:w-[500px] 2xl:w-[550px] mt-8 mx-auto px-16 py-8 rounded-lg">

                    <h2 class="text-center text-2xl font-bold tracking-wide text-gray-800">Cadastro de Máquinas Agrícolas</h2>
                    <p class="text-center text-sm text-gray-600 mt-2">Cadastro de Máquinas  

                    <form class="my-8 text-sm">
                        <div class="flex flex-col my-4">
                            <label for="name" class="text-gray-700">Nome da Máquina</label>
                            <input type="text" 
                            name="nome" 
                            id="nome" 
                            class="mt-2 p-2 border border-gray-300 focus:outline-none focus:ring-0 focus:border-gray-300 rounded text-sm text-gray-900 nome" placeholder="Nome da Máquina">
                        </div>

                        <div class="flex flex-col my-4">
                            <label for="fabricante" class="text-gray-700">Fabricante</label>
                            <input type="text" 
                            name="fabricante" 
                            id="fabricante" 
                            class="mt-2 p-2 border border-gray-300 focus:outline-none focus:ring-0 focus:border-gray-300 rounded text-sm text-gray-900 fabricante" placeholder="Nome do Fabricante">
                        </div>
                        
                        <div class="flex flex-col my-4">
                            <label for="potencia" class="text-gray-700">Potência</label>
                            <div x-data="{ show: false }" class="relative flex items-center mt-2 ">
                                <input :type=" show ? 'text': 'potencia' " name="potencia" 
                                id="potencia"
                                 class="flex-1 p-2 border pr-10 border-gray-300 focus:outline-none focus:ring-0 focus:border-gray-300 rounded text-sm text-gray-900" placeholder="Potência" type="text" >
                                <button @click="show = !show" type="button" class="absolute right-2 bg-transparent flex items-center justify-center text-gray-700">
                         
                                </button>
                            </div>
                        </div>

                        <div class="flex flex-col my-4">
                            <label for="password_confirmation" class="text-gray-700"></label>
                            <div x-data="{ show: false }" class="relative flex items-center mt-2">
                                <button @click="show = !show" type="button" class="absolute right-2 bg-transparent flex items-center justify-center text-gray-700">
                                </button>
                            </div>
                        </div>
     
                    
                        <div class="my-4 flex items-center justify-end space-x-4">
                            <button class="bg-blue-600 hover:bg-blue-700 rounded-lg px-8 py-2 text-gray-100 hover:shadow-xl transition duration-150 uppercase">Cadastrar</button>
                        </div>
                    </form>
                    <div class="resultado"></div>
                </div>
                <div class="flex items-center justify-center">
                    <img src="img/tractor-a-trabalhar-num-campo-verde_23-2151983626.avif" alt="">
                </div>
            </div>
        </div>
        <script src="script.js"></script>
</body>
</html>
