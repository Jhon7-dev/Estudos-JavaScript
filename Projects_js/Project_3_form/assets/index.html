<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Tailwind</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <form class="bg-white p-8 rounded-xl shadow-lg w-96 space-y-5 form">

        <h1 class="text-2xl font-bold text-center text-gray-800">
            Cadastro
        </h1>

        <div>
            <label 
            for="nome"
            class="block mb-2 text-sm font-medium text-gray-700 nome">
                Nome
            </label>

            <input 
            type="text"
            id="nome"
            placeholder="Digite seu Nome"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
        </div>
        <div>
            <label 
            for="sobrenome"
            class="block mb-2 text-sm font-medium text-gray-700 sobrenome">
                Sobrenome
            </label>

            <input 
            type="text"
            id="sobrenome"
            placeholder="Digite seu Sobrenome"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
        </div>

      
        <div>
            <label 
            for="altura"
            class="block mb-2 text-sm font-medium text-gray-700 altura">
               Altura
            </label>

            <input 
            type="text"
            id="altura"
            placeholder="Digite sua Altura"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
        </div>

       
        <div>
            <label 
            for="peso"
            class="block mb-2 text-sm font-medium text-gray-700 peso">
                Peso
            </label>

            <input 
            type="text"
            id="peso"
            placeholder="Digite seu Peso"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
        </div>

     
       <button 
            class="w-full bg-green-500 hover:bg-green-600 text-white p-3 rounded-lg transition duration-300">
                 Enviar
        </button>

    </form>
    <div class="resultado"></div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>

    <script src="js/script.js"></script>

</body>
</html>
